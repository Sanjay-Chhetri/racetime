# One-click deploy for Render. Railway reads the Procfile instead; both work
# from the same repo with no code changes.
services:
  - type: web
    name: racetime
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: racetime-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.10

databases:
  - name: racetime-db
    plan: free
