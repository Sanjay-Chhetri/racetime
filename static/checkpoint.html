<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181d">
<link rel="manifest" href="/manifest.json">
<title>Checkpoint · RaceTime</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314181d'/%3E%3Cpath d='M7 22V10h7a4 4 0 010 8h-2l5 4h-4l-4-4v4z' fill='%23f2c500'/%3E%3C/svg%3E">
<script>try{document.documentElement.dataset.wallpaper=localStorage.getItem('racetime.wallpaper')||'dawn'}catch(e){document.documentElement.dataset.wallpaper='dawn'}</script>
<link rel="stylesheet" href="/app.css">
</head>
<body class="full">

<!-- Setup: pick the event and checkpoint, then measure this phone's clock. -->
<section id="setup" style="padding:1rem;max-width:480px;margin:0 auto">
  <div class="masthead"><h1>Checkpoint</h1></div>
  <p>Set this phone up once at your post. It keeps working without a signal.</p>

  <label for="event">Race day</label>
  <select id="event"><option value="">Loading…</option></select>

  <!-- Kept for the case where the list cannot be fetched: a volunteer who
       arrives with no signal can still type the code they were given. -->
  <div id="manualEvent" hidden>
    <label for="code">Event code</label>
    <input id="code" placeholder="siliguri10k" autocapitalize="none" autocomplete="off">
    <button id="load" class="primary" style="margin-top:.6rem">Find event</button>
  </div>

  <div id="keyWrap" hidden>
    <label for="devKey">Checkpoint code</label>
    <input id="devKey" placeholder="ABC123" autocapitalize="characters"
           autocomplete="off" inputmode="text" maxlength="8"
           style="text-transform:uppercase;letter-spacing:.12em">
    <p class="note">This race needs a code before a phone may send scans. The
    organiser has it.</p>
  </div>

  <div id="pick" hidden>
    <div id="raceWrap" hidden>
      <label for="race">Race</label>
      <select id="race"></select>
    </div>
    <label for="cp">Your checkpoint</label>
    <select id="cp"></select>
    <button id="go" class="primary wide" style="margin-top:1rem">Start scanning</button>
    <p class="note" id="clockNote" style="margin-top:.8rem"></p>
  </div>
  <p class="note" id="setupErr" style="color:var(--stop)"></p>
</section>

<!-- Capture -->
<section id="capture" class="capture" hidden>
  <div class="capture-bar">
    <div class="cp" id="cpName">—</div>
    <span class="pill" id="status">starting</span>
    <button id="changeCp" class="linkbtn" title="Switch to a different checkpoint">change</button>
  </div>

  <div id="reader"></div>

  <div class="capture-foot">
    <div class="row">
      <input id="manual" class="num" inputmode="numeric" placeholder="Type bib" autocomplete="off">
      <button id="manualAdd" class="narrow">Add</button>
    </div>
    <div class="scanned"><span class="n" id="scanCount">0</span>
      <span>scanned at this checkpoint</span></div>
    <ul class="recent" id="recent"></ul>
  </div>
</section>

<div class="flash" id="flash" hidden>
  <div class="bib" id="flashBib"></div>
  <div class="who" id="flashWho"></div>
  <div class="what" id="flashWhat"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script type="module" src="/js/checkpoint.js"></script>
</body>
</html>
