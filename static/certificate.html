<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finisher certificate · RaceTime</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314181d'/%3E%3Cpath d='M7 22V10h7a4 4 0 010 8h-2l5 4h-4l-4-4v4z' fill='%23f2c500'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div class="masthead noprint">
  <h1>Finisher certificate</h1>
  <span class="where"><a href="/">home</a></span>
</div>

<section class="panel noprint" id="finder">
  <label for="event">Race</label>
  <select id="event"><option value="">Loading races…</option></select>

  <label for="find" style="margin-top:.9rem">Your name or bib number</label>
  <input id="find" placeholder="Start typing a name…" autocomplete="off" autocapitalize="words">

  <p class="note" id="count" style="margin:.7rem 0 0"></p>
  <ul class="finder" id="list"></ul>
  <p class="note" id="err" style="color:var(--stop)"></p>
</section>

<section class="panel noprint" id="actions" hidden>
  <div class="card-frame" id="cardFrame"></div>

  <div class="row" style="margin-top:1rem">
    <button id="save" class="primary">Save image</button>
    <label for="photo" class="filebtn" id="photoLabel">Add your photo</label>
    <input type="file" id="photo" accept="image/*" capture="user" hidden>
    <button id="removePhoto" hidden>Remove photo</button>
  </div>

  <p class="note" id="hint" style="margin:.7rem 0 0">
    Your photo stays on this device — it is drawn straight into the card and
    never uploaded. Reload the page and you will need to pick it again.
  </p>

  <div class="row" style="margin-top:.9rem">
    <button id="back">← Choose someone else</button>
    <button id="print">Print A4 certificate</button>
  </div>
</section>

<div id="sheet" hidden></div>

<script type="module" src="/js/certificate.js"></script>
</body>
</html>
