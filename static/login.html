<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14181d">
<meta name="robots" content="noindex">
<title>Sign in · RaceTime</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314181d'/%3E%3Cpath d='M7 22V10h7a4 4 0 010 8h-2l5 4h-4l-4-4v4z' fill='%23f2c500'/%3E%3C/svg%3E">
<!-- Set before first paint. A module is deferred, so doing this in theme.js
     would show the default colours and then jump to the chosen ones. -->
<script>try{document.documentElement.dataset.wallpaper=localStorage.getItem('racetime.wallpaper')||'dawn'}catch(e){document.documentElement.dataset.wallpaper='dawn'}</script>
<link rel="stylesheet" href="/app.css">
</head>
<body class="signin">

<main class="signinbox">
  <a class="brand" href="/">
    <span class="brandmark">R</span>
    <span class="brandname">RaceTime</span>
  </a>

  <h1>Sign in</h1>
  <p class="note">For race organisers and officials. Runners and spectators do
  not need an account &mdash; <a href="/">results and certificates are here</a>.</p>

  <form id="signinForm" autocomplete="on">
    <label for="username">Username</label>
    <input id="username" name="username" autocapitalize="none" autocorrect="off"
           autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>

    <p class="fieldErr" id="err" hidden></p>

    <button id="submit" class="primary wide" type="submit">Sign in</button>
  </form>

  <p class="note signinfoot">
    Forgotten it? A super admin can reset your password from the Members screen.
  </p>
</main>

<!-- Offered here as well as on the home page: whoever signs in on a laptop at
     a registration desk should not have to go back to pick a theme. -->
<div class="signinwall"><span id="wallpaper"></span></div>

<script type="module" src="/js/login.js"></script>
</body>
</html>
