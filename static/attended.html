<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14181d">
<meta name="robots" content="noindex">
<title>Participation certificate · RaceTime</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314181d'/%3E%3Cpath d='M7 22V10h7a4 4 0 010 8h-2l5 4h-4l-4-4v4z' fill='%23f2c500'/%3E%3C/svg%3E">
<script>try{document.documentElement.dataset.wallpaper=localStorage.getItem('racetime.wallpaper')||'dawn'}catch(e){document.documentElement.dataset.wallpaper='dawn'}</script>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div class="masthead noprint">
  <h1>Participation certificate</h1>
  <span class="where"><a href="/me.html#workshops">my workshops</a></span>
</div>

<section class="panel noprint" id="actions" hidden>
  <div class="card-frame" id="cardFrame"></div>
  <div class="row" style="margin-top:1rem">
    <button id="save" class="primary">Share</button>
    <button id="download">Download</button>
  </div>
  <p class="note" style="margin:.7rem 0 0">
    Yours because you turned up. It carries the session, the date and who took
    it &mdash; not a time or a placing, because a workshop has neither.
  </p>
</section>

<p class="fieldErr" id="err" hidden></p>

<script type="module" src="/js/attended.js"></script>
</body>
</html>
