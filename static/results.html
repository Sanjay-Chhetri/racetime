<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14181d">
<title>Results · RaceTime</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314181d'/%3E%3Cpath d='M7 22V10h7a4 4 0 010 8h-2l5 4h-4l-4-4v4z' fill='%23f2c500'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body class="wide">

<div class="masthead">
  <h1 id="title">Results</h1>
  <span class="where clock" id="clock"></span>
</div>

<!-- A spectator arriving cold needs to know, before anything else, whether
     this is still running and how far along it is. -->
<header class="racehead" id="racehead" hidden>
  <div class="racehead-top">
    <span class="livepill" id="livePill"></span>
    <span class="racedate" id="raceDate"></span>
  </div>
  <div class="scoreboard" id="scoreboard"></div>
</header>

<div class="row" style="margin-bottom:.7rem">
  <input id="find" placeholder="Find a runner by name or bib" autocomplete="off">
</div>

<div class="filters" id="filters" hidden>
  <div class="chips" id="raceChips" role="group" aria-label="Filter by race" hidden></div>
  <div class="chips" id="statusChips" role="group" aria-label="Filter by status"></div>
  <div class="chips" id="catChips" role="group" aria-label="Filter by category"></div>
  <div class="chips" id="genChips" role="group" aria-label="Filter by gender" hidden></div>
</div>

<div class="tally" id="tally"></div>

<table class="stack">
  <thead><tr id="head">
    <th class="num sortable" data-sort="position">#</th>
    <th class="num sortable" data-sort="bib">Bib</th>
    <th class="sortable" data-sort="name">Runner</th>
    <th class="num sortable" data-sort="time">Finish</th>
    <th>Gap</th>
  </tr></thead>
  <tbody id="rows">
    <tr class="skel"><td><span class="bar"></span></td><td><span class="bar"></span></td><td><span class="bar"></span></td><td><span class="bar"></span></td><td><span class="bar"></span></td></tr>
    <tr class="skel"><td><span class="bar"></span></td><td><span class="bar"></span></td><td><span class="bar"></span></td><td><span class="bar"></span></td><td><span class="bar"></span></td></tr>
    <tr class="skel"><td><span class="bar"></span></td><td><span class="bar"></span></td><td><span class="bar"></span></td><td><span class="bar"></span></td><td><span class="bar"></span></td></tr>
  </tbody>
</table>

<p class="note" style="margin-top:1.5rem">
  Tap any runner for their splits. Times refresh automatically.
</p>

<script type="module" src="/js/results.js"></script>
</body>
</html>
